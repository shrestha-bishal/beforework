<div class="Overlay Overlay--size-medium position-relative" data-modal role="dialog" aria-modal="true">
  <button class="btn btn-invisible closeX" data-close>✕</button>
  <h3>Keyboard shortcuts</h3>
  <div>
    <div class="shortcutRow"><span>Open search and commands</span><kbd>/</kbd></div>
    <div class="shortcutRow"><span>Open the command palette</span><kbd>Ctrl/⌘ + K</kbd></div>
    <div class="shortcutRow"><span>Quick-add an item to the open project</span><kbd>n</kbd></div>
    <div class="shortcutRow"><span>Toggle dark / light mode</span><kbd>d</kbd></div>
    <div class="shortcutRow"><span>Collapse / expand the sidebar</span><kbd>[</kbd></div>
    <div class="shortcutRow"><span>Open or close the focus timer</span><kbd>t</kbd></div>
    <div class="shortcutRow"><span>Undo the last change</span><kbd>Ctrl/⌘ + Z</kbd></div>
    <div class="shortcutRow"><span>Close the open item or dialog</span><kbd>Esc</kbd></div>
    <div class="shortcutRow"><span>Show this shortcuts list</span><kbd>?</kbd></div>
  </div>
  <div class="uiDivider modalDivider" aria-hidden="true"></div>
  <div class="modalFooter"><button class="btn btn-primary btn-sm" data-close>Got it</button></div>
</div>

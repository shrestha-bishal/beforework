<template id="boardGroupTemplate">
  <div class="group Box">
    <div class="groupHead">
      <input class="form-control groupTitle" type="text">
      <span class="Counter Counter--secondary" data-board-group-count></span>
      <button class="btn btn-invisible btn-sm fieldColumnMenuBtn action-menu__trigger" data-action="groupMenu" type="button" title="Group actions" aria-label="Group actions">⋮</button>
      <div class="menu action-menu action-menu--field fieldColumnMenu" role="menu" hidden><button type="button" data-group-action="edit">Edit</button><button type="button" data-group-action="delete" class="danger menu-item menu-item--danger" role="menuitem">Delete</button></div>
    </div>
    <div class="groupBody"></div>
    <button class="btn addItemBtn" data-action="addItem" type="button">+ Add item</button>
  </div>
</template>

<template id="boardCardTemplate">
  <div class="card Box">
    <div class="cardTitle"><span class="cardPriority"></span><span data-board-card-title></span></div>
    <div class="cardMeta">
      <span class="Label Label--secondary cardArchived" hidden>Archived</span>
      <span class="Counter Counter--secondary cardSubitemCount" hidden></span>
      <span class="Counter Counter--secondary cardCommentCount" title="Comments" hidden>💬 <span data-board-comment-count></span></span>
      <span class="cardDateChips"></span>
      <span class="cardTags"></span>
    </div>
  </div>
</template>

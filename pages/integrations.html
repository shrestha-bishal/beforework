<div class="integrationWrap">
  <div class="integrationHeader"><iconify-icon icon="mdi:hub-outline"></iconify-icon><div><h3>Integrations</h3><p>Connect external services while keeping Beforework as your local workspace.</p></div></div>
  <div class="integrationCard">
    <div class="integrationCardHead"><iconify-icon icon="logos:google-calendar"></iconify-icon><strong>Google Calendar</strong><span class="integrationStatus" data-integration-connection></span></div>
    <p class="dialogMessage">Sync linked calendar events and import tasks from all Google Tasks lists. Google Tasks imports are one-way; edit them in Google to sync changes.</p>
    <div class="linkedCalendarList" data-linked-calendar-list>
      <div class="integrationEmpty" data-no-linked-calendars hidden>No Google calendars linked yet.</div>
      <template id="linkedCalendarRowTemplate">
        <div class="linkedCalendarRow">
          <iconify-icon icon="mdi:calendar-check-outline"></iconify-icon>
          <span></span>
          <button class="btn btn-sm btn-invisible" data-unlink-calendar>Unlink</button>
        </div>
      </template>
    </div>
    <div class="integrationActions">
      <button class="btn btn-primary btn-sm" data-integration-link><iconify-icon icon="mdi:link-variant" style="vertical-align:-2px;margin-right:4px;"></iconify-icon><span data-integration-link-label>Link calendars</span></button>
      <button class="btn btn-sm" data-integration-sync hidden>Sync now</button>
      <button class="btn btn-sm" data-integration-connect hidden>Connect Google</button>
      <span class="integrationStatus" data-integration-last-sync></span>
    </div>
  </div>
</div>

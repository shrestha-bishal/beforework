<div id="sidebarScrim"></div>
<div id="sidebar">
  <div id="sidebarWrap">
    <h1><button class="brandHomeBtn" id="brandHomeBtn" type="button" title="Go to overview" aria-label="Go to overview"><img class="mark" src="images/icon-wide.png" alt=""><img class="markCompact" src="images/icon.png" alt=""></button></h1>
    <div class="workspaceSwitcher">
      <button class="workspaceSwitcherBtn" id="workspaceSwitcherBtn" type="button" aria-expanded="false" aria-controls="secondarySidebar">
        <iconify-icon icon="mdi:briefcase-outline" aria-hidden="true"></iconify-icon>
        <span id="workspaceSwitcherLabel">Workspace</span>
        <span class="workspaceSwitcherCaption">Workspace</span>
        <iconify-icon class="workspaceSwitcherChevron" icon="mdi:chevron-down" aria-hidden="true"></iconify-icon>
      </button>
    </div>
    <div class="searchWrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input class="form-control" id="globalSearch" type="text" placeholder="Search or run a command" aria-label="Search projects, tasks, or actions" title="Search or run a command" readonly>
      <kbd class="searchShortcut" aria-hidden="true">Ctrl K</kbd>
    </div>
  </div>

  <div id="overviewNav" title="Overview" aria-label="Overview"><iconify-icon icon="mdi:view-dashboard-outline" aria-hidden="true"></iconify-icon><span>Overview</span></div>
  <button id="projectsNav" type="button" title="Projects" aria-label="Projects" aria-expanded="false" aria-controls="secondarySidebar"><iconify-icon icon="mdi:layers-outline" aria-hidden="true"></iconify-icon><span>Projects</span></button>
  <button id="workspaceDocumentsNav" type="button" title="Documents" aria-label="Documents" aria-expanded="false" aria-controls="secondarySidebar"><iconify-icon icon="mdi:file-document-multiple-outline" aria-hidden="true"></iconify-icon><span>Documents</span></button>
  <div id="calendarNav" title="Calendar" aria-label="Calendar"><iconify-icon icon="mdi:calendar-month-outline" aria-hidden="true"></iconify-icon><span>Calendar</span></div>
  <div id="roadmapNav" title="Roadmap" aria-label="Roadmap"><iconify-icon icon="mdi:chart-gantt" aria-hidden="true"></iconify-icon><span>Roadmap</span></div>

  <div class="sidebarBottomNav">
    <div class="uiDivider sidebarNavDivider" aria-hidden="true"></div>
    <button id="focusTimerNav" type="button" title="Focus timer" aria-label="Focus timer"><iconify-icon icon="mdi:timer-outline" aria-hidden="true"></iconify-icon><span>Timer</span></button>
    <div id="integrationsNav" title="Integrations" aria-label="Integrations"><iconify-icon icon="mdi:hub-outline" aria-hidden="true"></iconify-icon><span>Integrations</span></div>
    <div id="settingsNav" title="Settings" aria-label="Settings"><iconify-icon icon="mdi:cog-outline" aria-hidden="true"></iconify-icon><span>Settings</span></div>
    <div class="uiDivider supportNavDivider" aria-hidden="true"></div>
    <button id="supportNav" type="button" title="Support Beforework" aria-label="Support Beforework"><iconify-icon icon="mdi:heart-outline" aria-hidden="true"></iconify-icon><span>Support</span></button>
    <button id="feedbackNav" type="button" title="Feature requests and bug reports" aria-label="Feature requests and bug reports"><iconify-icon icon="mdi:message-alert-outline" aria-hidden="true"></iconify-icon><span>Requests</span></button>
  </div>
</div>

<aside id="secondarySidebar" aria-labelledby="secondarySidebarTitle" aria-hidden="true" inert>
  <div class="secondarySidebarHeader">
    <h2 id="secondarySidebarTitle"></h2>
    <div class="secondarySidebarActions">
      <button id="secondarySidebarClose" type="button" title="Close sidebar" aria-label="Close sidebar"><iconify-icon icon="mdi:chevron-left" aria-hidden="true"></iconify-icon></button>
      <div class="projectCreateWrap">
        <button class="btn btn-sm btn-invisible projectCreateBtn" id="projectCreateBtn" type="button" title="Create project or folder" aria-label="Create project or folder" aria-haspopup="menu" aria-expanded="false" aria-controls="projectCreateMenu"><iconify-icon icon="mdi:plus" aria-hidden="true"></iconify-icon></button>
        <div class="menu action-menu action-menu--create" id="projectCreateMenu" role="menu" hidden>
          <button class="btn btn-sm btn-invisible" id="addProjectBtn" type="button" role="menuitem"><iconify-icon icon="mdi:view-grid-plus-outline" aria-hidden="true"></iconify-icon><span>New project</span></button>
          <button class="btn btn-sm btn-invisible" id="importProjectBtn" type="button" role="menuitem"><iconify-icon icon="mdi:table-arrow-up" aria-hidden="true"></iconify-icon><span>Import project</span></button>
          <button class="btn btn-sm btn-invisible" id="addFolderBtn" type="button" role="menuitem"><iconify-icon icon="mdi:folder-plus-outline" aria-hidden="true"></iconify-icon><span>New folder</span></button>
        </div>
      </div>
    </div>
  </div>
  <div id="secondarySidebarContent">
    <div class="workspaceSidebarActions" id="workspaceSidebarActions">
      <div class="workspaceSidebarIdentity">
        <iconify-icon icon="mdi:briefcase-outline" aria-hidden="true"></iconify-icon>
        <div>
          <span>Current workspace</span>
          <strong id="workspaceSidebarName">Workspace</strong>
        </div>
      </div>
      <button class="btn btn-sm btn-invisible" id="workspaceSwitchBtn" type="button"><iconify-icon icon="mdi:folder-swap-outline" aria-hidden="true"></iconify-icon><span>Open different workspace</span></button>
      <button class="btn btn-sm btn-invisible" id="workspaceNewBtn" type="button"><iconify-icon icon="mdi:folder-plus-outline" aria-hidden="true"></iconify-icon><span>Create new workspace</span></button>
    </div>
    <div class="sidebarProjects" id="sidebarProjects">
      <ul class="SideNav" id="projectList"></ul>
    </div>
  </div>
</aside>

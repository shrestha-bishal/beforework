<div class="calendarToolbar">
  <button class="btn btn-sm" data-calendar-action="prev" aria-label="Previous month">‹</button>
  <button class="btn btn-sm" data-calendar-action="today">Today</button>
  <button class="btn btn-sm" data-calendar-action="next" aria-label="Next month">›</button>
  <h3 data-calendar-month></h3>
  <span class="filterSummary" data-calendar-scope></span>
  <div class="calendarViewModes" role="group" aria-label="Calendar view">
    <button class="btn btn-sm" type="button" data-calendar-view="day" aria-pressed="false">Day</button>
    <button class="btn btn-sm" type="button" data-calendar-view="week" aria-pressed="false">Week</button>
    <button class="btn btn-sm" type="button" data-calendar-view="month" aria-pressed="true">Month</button>
  </div>
  <button class="btn btn-sm" data-calendar-action="new">+ New</button>
  <button class="btn btn-sm btn-primary" data-calendar-action="google" data-calendar-global hidden><iconify-icon icon="mdi:sync" style="vertical-align:-2px;margin-right:4px;"></iconify-icon><span data-google-action-label>Sync now</span></button>
  <div class="calendarToolbarMenuWrap">
    <button class="btn btn-invisible btn-sm calendarToolbarMenuBtn action-menu__trigger" type="button" aria-label="Calendar actions" aria-haspopup="menu" aria-expanded="false" aria-controls="calendarActionsMenu">⋮</button>
    <div class="menu action-menu action-menu--view calendarToolbarMenu" id="calendarActionsMenu" role="menu" hidden>
      <button type="button" data-calendar-action="ics"><iconify-icon icon="mdi:calendar-export-outline" aria-hidden="true"></iconify-icon><span>Export .ics</span></button>
      <button type="button" data-calendar-action="integrations" data-calendar-global hidden><iconify-icon icon="mdi:link-variant" aria-hidden="true"></iconify-icon><span>Link calendars</span></button>
    </div>
  </div>
  <span class="calendarSyncStatus" data-calendar-sync-status data-google-sync-status data-calendar-global hidden></span>
  <progress class="calendarSyncProgress" data-google-sync-progress data-calendar-global max="1" value="0" hidden></progress>
</div>
<template id="calendarDayTemplate">
  <div class="calendarDay">
    <div class="calendarDayNumber"></div>
  </div>
</template>
<template id="calendarEventTemplate">
  <div class="calendarEvent" draggable="true" role="group">
    <button class="calendarEventOpen" type="button">
      <span class="eventDot"></span>
      <span class="eventTitle"></span>
      <span class="eventProject" hidden></span>
    </button>
  </div>
</template>
<div class="calendarGrid" data-calendar-grid></div>
